<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#00A86B" />
    <!-- OSダークモードでも native の選択肢（select/option/日時ピッカー）の文字が消えないよう明色に固定（2026-08-07） -->
    <meta name="color-scheme" content="light" />
    <!-- iOSは「共有→ホーム画面に追加」でしかインストールできず、standalone起動には
         この3つのapple-mobile-web-app-*が要る（manifestのdisplay:standaloneだけでは
         iOSバージョンによってアドレスバーが消えないため） -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent＝ステータスバーを透明にしてアプリを画面最上端まで描く（2026-07-31たきと指示
         「トップが切れている。画面最大限に使え」）。時計と重なるページは env(safe-area-inset-top) で逃がす -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="chitose-bank" />
    <!-- 起動を速くする（2026-07-27たきと指示「リロードが遅い」）：
         ① 接続の下ごしらえ（DNS+TLS）を先に済ませる。SupabaseはJSが動くまで叩かれないため、
            ここで温めておくと最初の問い合わせが数百ms速くなる（URLは公開情報＝anonキーと同じくクライアントに出る）
         ② WebフォントはJS内の@importから移設。@importはJSが落ちてCSSが注入された後にようやく走るため、
            文字の出方が遅れていた。リンクにするとHTML解析の時点で並行して取りに行ける -->
    <link rel="preconnect" href="https://aegwepgtmwcnwzybpgsh.supabase.co" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Inter:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap" />
    <!-- 起動スケルトン（2026-08-03たきと報告「リロードやサイトに入った時、画面が真っ黒のまま」の根治・第2層）：
         この<style>と直後の#cb-bootは【HTMLに直接書く】ことに意味がある。JSもCSSファイルも待たずに
         最初の描画から効くため、JSの読み込み〜Reactのマウントまでの空白（＝黒画面だった区間）が
         白いページの骨に変わる。Reactが立ち上がる瞬間に main.jsx が #cb-boot を外して本体に引き継ぐ。
         ★色・寸法はアプリの実物に合わせる（ヘッダ64px／下部バー64px／本文は角丸14の帯）＝
         骨から本体への切り替わりが飛ばない -->
    <style>
      html { background: #fff; color-scheme: light; }
      body { margin: 0; background: #fff; }
      #cb-boot { position: fixed; inset: 0; background: #fff; z-index: 1; }
      #cb-boot .cb-boot-head { height: 64px; border-bottom: 1px solid #F0F0F0; display: flex; align-items: center; padding: 0 16px; box-sizing: border-box; }
      #cb-boot .cb-boot-body { padding: 16px; display: grid; gap: 10px; }
      #cb-boot .cb-boot-foot { position: fixed; left: 0; right: 0; bottom: 0; height: calc(64px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid #F0F0F0; background: #fff; display: flex; align-items: center; justify-content: space-around; padding: 0 16px env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
      #cb-boot i { display: block; border-radius: 14px; background: linear-gradient(90deg, #F2F2F2 25%, #E9E9E9 37%, #F2F2F2 63%); background-size: 400% 100%; animation: cbBootShim 1.4s ease infinite; }
      @keyframes cbBootShim { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
    </style>
    <title>chitose-bank</title>
  </head>
  <body>
    <div id="root">
      <div id="cb-boot" aria-busy="true" aria-label="読み込み中">
        <div class="cb-boot-head"><i style="width:120px;height:22px;border-radius:6px"></i></div>
        <div class="cb-boot-body">
          <i style="height:44px;border-radius:22px"></i>
          <i style="height:190px"></i>
          <i style="height:190px"></i>
          <i style="height:190px"></i>
        </div>
        <div class="cb-boot-foot">
          <i style="width:34px;height:34px;border-radius:10px"></i>
          <i style="width:34px;height:34px;border-radius:10px"></i>
          <i style="width:34px;height:34px;border-radius:10px"></i>
        </div>
      </div>
    </div>
    <!-- 真っ白画面の自己修復（2026-07-29）：新デプロイでファイル名（ハッシュ）が変わるため、
         古いindex.htmlを握ったままの端末は存在しないJSを404で取りに行き、何も描画されないまま止まる。
         この場合アプリのJSが1行も動かないので、アプリ内のエラー捕捉も自己修復も働かない。
         そこでHTML側で最初のスクリプト読み込みの失敗を捕まえ、古いService Worker・キャッシュを捨てて
         1度だけ読み直す（無限リロード防止のためセッションに1回）。 -->
    <script>
      window.addEventListener('error', function (e) {
        var t = e && e.target;
        if (!t || t.tagName !== 'SCRIPT') return;
        try {
          if (sessionStorage.getItem('cb_bootReload')) return;
          sessionStorage.setItem('cb_bootReload', '1');
        } catch (_) { return; }
        var reload = function () { location.reload(); };
        try {
          var jobs = [];
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister(); }));
            }));
          }
          if (window.caches && caches.keys) {
            jobs.push(caches.keys().then(function (ks) {
              return Promise.all(ks.map(function (k) { return caches.delete(k); }));
            }));
          }
          Promise.all(jobs).then(reload, reload);
        } catch (_) { reload(); }
      }, true);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
