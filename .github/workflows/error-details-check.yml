name: Error details browser checks
on:
  pull_request:
    paths:
      - src/components/admin/AdminSystemRoom.jsx
      - src/lib/error*.js
      - scripts/error*.mjs
      - scripts/fixtures/error-diagnosis/**
      - package*.json
      - .github/workflows/error-details-check.yml
permissions:
  contents: read
concurrency:
  group: error-details-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Tokyo
      CB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CB_EVIDENCE_DIR: error-details-evidence
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: Verify detail layout and direct links with synthetic records
        run: node scripts/error-details-browser-qa.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: error-details-evidence
          path: error-details-evidence
          if-no-files-found: warn
          retention-days: 7
