name: Production read-only stage 4
on:
  push:
    branches: ['verify/production-stage4-20261014']
permissions:
  contents: read
concurrency:
  group: production-readonly-stage4
  cancel-in-progress: true
jobs:
  readonly-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install locked test dependencies
        run: npm ci
      - name: Install browser engines
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Check actual production assets and clean mobile rendering, with all writes blocked
        run: node --test scripts/production-readonly.test.mjs
