name: Photo input integrity checks
on:
  pull_request:
    paths:
      - src/lib/image.js
      - src/lib/photoStorage.js
      - src/components/admin/AdminSystemRoom.jsx
      - src/features/jobs/create/components/StepPhotos.jsx
      - src/features/jobs/create/components/StepDanger.jsx
      - src/features/jobs/create/LandingFlow.jsx
      - src/features/consignment/ConsignmentRoom.jsx
      - scripts/photo-*.test.mjs
      - scripts/fixtures/photo-*
      - package.json
      - package-lock.json
      - .github/workflows/photo-input-check.yml
permissions:
  contents: read
concurrency:
  group: photo-input-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
