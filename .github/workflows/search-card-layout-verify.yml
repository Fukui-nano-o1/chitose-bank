name: Search card layout verification
on:
  push:
    branches: [fix/search-card-video-below-20261006]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply scoped source changes
        run: python3 .search-card-layout-patch.py
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Full production build and regression tests
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/search-card-build.log
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit > /tmp/search-card-browser-install.log 2>&1
      - name: Verify search card layout and controls
        run: node scripts/search-card-video-layout.mjs
      - name: Verify existing detail video safe areas
        run: node scripts/job-work-video-layout.mjs
      - name: Commit verified source to isolated branch
        run: |
          rm .search-card-layout-patch.py .github/workflows/search-card-layout-verify.yml
          git diff --check
          git diff -- src scripts > /tmp/search-card-verified.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/JobCard.jsx src/components/JobVideoCard.jsx src/components/JobSearchMapView.jsx scripts/fixtures/job-video/entry.jsx scripts/job-video-facade.test.mjs scripts/search-card-video-layout.mjs .search-card-layout-patch.py .github/workflows/search-card-layout-verify.yml scripts/search-card-video-assertions.txt
          git commit -m 'Keep search photo and summary cards above standalone optional YouTube'
          git push origin HEAD:fix/search-card-video-below-20261006
          git show -s --format='%H %T'
      - name: Keep verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-card-video-verification
          path: |
            /tmp/search-card-build.log
            /tmp/search-card-video-layout.json
            /tmp/search-card-video-mobile.png
            /tmp/search-card-verified.patch
            /tmp/detail-video-safe-results.json
          retention-days: 3
