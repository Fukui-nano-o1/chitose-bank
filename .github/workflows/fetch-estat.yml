name: Fetch e-Stat Agricultural Data
on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install node-fetch@3
      - name: Fetch and store data
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_SERVICE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/fetch-estat.mjs
