name: Apply and verify scoped listing stage 2
on:
  push:
    branches: [feat/listing-flow-stage2-20261022]
    paths: [.github/workflows/listing-stage2-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Apply only the locally validated patch on the inspected feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feat/listing-flow-stage2-20261022'
          test "$(git rev-parse HEAD^)" = '4050d37bddd5ac4d12cf8d68f7b9f7b93b0a603a'
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, re, subprocess
          data = ''.join(pathlib.Path(f'scripts/.listing-stage2-part{i}').read_text() for i in (1,2,3))
          patch = lzma.decompress(base64.b64decode(data, validate=True), memlimit=128*1024*1024)
          assert hashlib.sha256(patch).hexdigest() == '26f847882bccfe7c2b5ed705273043d4bab2d258320dc7f7d5c6a59c661a2b6a'
          paths = re.findall(r'^diff --git a/(.+) b/(.+)$', patch.decode(), re.M)
          expected = '''.github/workflows/listing-flow-foundation-check.yml
          .github/workflows/listing-stage2-workbench.yml
          docs/uiux/listing-flow-redesign.md
          package.json
          scripts/fixtures/listing-schedule-frame-entry.jsx
          scripts/fixtures/offline/entry.jsx
          scripts/listing-flow-foundation.test.mjs
          scripts/listing-schedule-ui.test.mjs
          scripts/listing-schedule.test.mjs
          src/App.jsx
          src/components/CalendarView.jsx
          src/features/jobs/create/AGENTS.md
          src/features/jobs/create/LandingFlow.jsx
          src/features/jobs/create/components/ListingPage.jsx
          src/features/jobs/create/components/StepSchedule.jsx
          src/features/jobs/create/flowSteps.js
          src/features/jobs/create/listingFlow.css
          src/features/jobs/create/listingNavigation.js
          src/features/jobs/create/listingPagePlan.js
          src/features/jobs/create/useListingNavigation.js'''.splitlines()
          assert paths == [(p,p) for p in expected]
          subprocess.run(['git','apply','--check','--unidiff-zero','-'],input=patch,check=True)
          subprocess.run(['git','apply','--unidiff-zero','-'],input=patch,check=True)
          pathlib.Path('/tmp/listing-stage2-paths').write_text('\n'.join(expected))
          PY
          git rm .github/workflows/listing-stage2-apply.yml scripts/.listing-stage2-part1 scripts/.listing-stage2-part2 scripts/.listing-stage2-part3
          git diff --check
      - run: npm ci
      - name: Full save, publish, navigation and UI regressions plus lint and production build
        shell: bash
        run: |
          set +e
          npm run build > "$RUNNER_TEMP/listing-stage2-build.log" 2>&1
          result=$?
          set -e
          grep -E '^# (tests|pass|fail|skipped|cancelled)|problems \(' "$RUNNER_TEMP/listing-stage2-build.log" || true
          tail -15 "$RUNNER_TEMP/listing-stage2-build.log"
          if [ "$result" != 0 ]; then tail -200 "$RUNNER_TEMP/listing-stage2-build.log"; fi
          exit "$result"
      - name: Commit verified stage 2 to its feature branch only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feat/listing-flow-stage2-20261022'
          python3 - <<'PY'
          import pathlib, subprocess
          expected = pathlib.Path('/tmp/listing-stage2-paths').read_text().splitlines()
          cleanup = ['.github/workflows/listing-stage2-apply.yml'] + [f'scripts/.listing-stage2-part{i}' for i in (1,2,3)]
          changed = set(subprocess.check_output(['git','diff','HEAD','--name-only'],text=True).splitlines())
          changed.update(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          assert changed == set(expected + cleanup), changed.symmetric_difference(set(expected + cleanup))
          subprocess.run(['git','add','--',*expected],check=True)
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: split listing schedule holidays and headcount with safe resume'
          cat > "$RUNNER_TEMP/listing-stage2-askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *) printf '%s\n' "$GH_TOKEN" ;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/listing-stage2-askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/listing-stage2-askpass"
          test "$(git ls-remote origin refs/heads/feat/listing-flow-stage2-20261022 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/feat/listing-flow-stage2-20261022
          rm "$RUNNER_TEMP/listing-stage2-askpass"
          git log -1 --format='%H %s'
