name: Prepare listing foundation extraction
on:
  push:
    branches: [feat/listing-flow-stage1-20261021]
    paths:
      - scripts/apply-listing-foundation.mjs
      - .github/workflows/listing-foundation-bootstrap.yml
permissions:
  contents: write
jobs:
  extract-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Extract only the common page wrapper and register regression tests
        run: node scripts/apply-listing-foundation.mjs
      - name: Check diff and complete build before committing generated changes
        run: |
          git diff --check
          git diff -- src/features/jobs/create/LandingFlow.jsx package.json
          npm run build
      - name: Commit verified extraction to this feature branch only
        run: |
          test "$GITHUB_REF" = "refs/heads/feat/listing-flow-stage1-20261021"
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' package.json src/features/jobs/create/LandingFlow.jsx | sort)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json src/features/jobs/create/LandingFlow.jsx
          git commit -m 'refactor: connect shared listing page shell and register foundation tests'
          git push origin HEAD:refs/heads/feat/listing-flow-stage1-20261021
