name: Detail YouTube safe-area verification
on:
  push:
    branches: [fix/detail-video-safe-20261006]
    paths: ['.detail-video-safe-patch.py', 'src/features/jobs/search/components/jobWorkVideo.css', 'scripts/job-work-video-layout.mjs', '.github/workflows/detail-video-safe-verify.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply scoped detail video correction
        run: python3 .detail-video-safe-patch.py
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Full production build with existing tests
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/detail-video-safe-build.log
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Verify player safe areas and controls in two browser engines
        run: node scripts/job-work-video-layout.mjs
      - name: Verify unchanged list-card swipe behavior
        run: node scripts/all-card-media-browser.mjs
      - name: Commit tested source to isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .detail-video-safe-patch.py .github/workflows/detail-video-safe-verify.yml
          git add src/features/jobs/search/components/JobDetailPanel.jsx src/features/jobs/search/components/jobWorkVideo.css scripts/job-work-video-layout.mjs
          git commit -m 'Keep detail YouTube controls below phone safe areas without stretching the player'
          git push origin HEAD:fix/detail-video-safe-20261006
      - name: Keep verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detail-video-safe-verification
          path: |
            /tmp/detail-video-safe-build.log
            /tmp/detail-video-safe-results.json
            /tmp/detail-video-safe-mobile.png
            /tmp/all-card-media-browser.json
          if-no-files-found: ignore
          retention-days: 3
