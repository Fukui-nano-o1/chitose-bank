name: Search card photo text verification
on:
  push:
    branches: ['fix/search-card-photo-text-20261006']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply scoped search display changes
        run: python3 .search-photo-summary-patch.py
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Full build and existing tests
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/photo-summary-build.log
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit > /tmp/photo-summary-browser-install.log 2>&1
      - name: Verify text on photos and independent video
        run: node scripts/search-card-photo-summary.mjs
      - name: Verify previous video layout and safe areas
        run: |
          node scripts/search-card-video-layout.mjs
          node scripts/job-work-video-layout.mjs
      - name: Commit verified source on isolated branch
        run: |
          rm .search-photo-summary-patch.py .github/workflows/search-photo-summary-verify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/JobCard.jsx src/components/JobVideoCard.jsx src/components/jobCardPhotoSummary.css scripts/search-card-photo-summary.mjs .search-photo-summary-patch.py .github/workflows/search-photo-summary-verify.yml
          git diff --cached > /tmp/photo-summary-verified.patch
          git commit -m 'Display pay and conditions on search card photos while keeping YouTube below'
          git push origin HEAD:fix/search-card-photo-text-20261006
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-photo-summary-verification
          retention-days: 3
          path: |
            /tmp/photo-summary-build.log
            /tmp/photo-summary-results.json
            /tmp/photo-summary-mobile.png
            /tmp/photo-summary-failure.png
            /tmp/photo-summary-verified.patch
            /tmp/search-card-video-layout.json
            /tmp/detail-video-safe-results.json
