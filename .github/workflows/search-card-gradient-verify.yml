name: Search card bottom summary and gradual shading verification
on:
  push:
    branches: [fix/search-card-gradient-20261007]
permissions:
  contents: write
concurrency:
  group: search-card-gradient-verify
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Update assertions for the withdrawn text distribution
        run: python3 .search-card-gradient-test-patch.py
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Full production build and existing tests
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/card-gradient-build.log
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit > /tmp/card-gradient-browser-install.log 2>&1
      - name: Verify bottom grouping, gradual shading and card controls
        run: |
          set -o pipefail
          node scripts/search-card-photo-summary.mjs 2>&1 | tee /tmp/card-gradient-layout.log
      - name: Verify unchanged YouTube positioning and phone safe areas
        run: |
          set -o pipefail
          node scripts/search-card-video-layout.mjs 2>&1 | tee /tmp/card-gradient-video.log
          node scripts/job-work-video-layout.mjs 2>&1 | tee /tmp/card-gradient-safe.log
      - name: Commit tested source on isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --check
          git rm .search-card-gradient-test-patch.py .github/workflows/search-card-gradient-verify.yml
          git add src/components/jobCardPhotoSummary.css scripts/search-card-photo-summary.mjs
          git commit -m 'Restore grouped bottom summary and use a gradual dark backdrop'
          git push origin HEAD:fix/search-card-gradient-20261007
      - name: Keep verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: search-card-gradient-verification
          retention-days: 3
          path: |
            /tmp/card-gradient-build.log
            /tmp/card-gradient-layout.log
            /tmp/card-gradient-video.log
            /tmp/card-gradient-safe.log
            /tmp/photo-summary-results.json
            /tmp/photo-summary-mobile.png
            /tmp/photo-summary-failure.png
            /tmp/search-card-video-layout.json
            /tmp/detail-video-safe-results.json
