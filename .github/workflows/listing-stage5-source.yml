name: Stage 5 isolated source snapshot
on:
  push:
    branches: [feat/listing-flow-stage5-20261026]
    paths: [.github/workflows/listing-stage5-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4b0b34b860d45a0db915139f9817c5a9c8804d58
          persist-credentials: false
      - name: Archive exact stage4 tracked source only
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/stage4-base.tgz" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage5-source-base
          path: ${{ runner.temp }}/stage4-base.tgz
          retention-days: 3
