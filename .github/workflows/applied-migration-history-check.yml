name: Applied migration identity checks
on:
  pull_request:
    paths:
      - supabase/migrations/**
      - scripts/applied-migration-history.test.mjs
      - scripts/fixtures/input-save-applied-migrations.json
      - .github/workflows/applied-migration-history-check.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test scripts/applied-migration-history.test.mjs
