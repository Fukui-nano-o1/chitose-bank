name: Verify search photo swipes
on:
  push:
    branches: [codex/search-photo-swipe-20261014]
permissions:
  contents: write
concurrency:
  group: search-photo-swipe-20261014
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply scoped change without publishing the temporary workflow
        run: |
          cp scripts/apply-search-photo-swipe.py /tmp/apply-search-photo-swipe.py
          cp scripts/search-photo-swipe.browser.mjs /tmp/search-photo-swipe.browser.mjs
          git checkout --detach 59be5bba26b0199bf328ebd3c4724c107c88c9d6
          test -z "$(git status --porcelain)"
          cp /tmp/search-photo-swipe.browser.mjs scripts/search-photo-swipe.browser.mjs
          python /tmp/apply-search-photo-swipe.py
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/search-photo-swipe.browser.mjs')
          s=p.read_text()
          old="import { JobSearchMapView } from './src/components/JobSearchMapView.jsx';"
          assert s.count(old)==1
          s=s.replace(old,old+"\nimport { setCache } from './src/lib/viewCache.js';",1)
          old="createRoot(document.getElementById('root')).render("
          assert s.count(old)==1
          s=s.replace(old,"Object.entries(cache).forEach(([key,value])=>setCache(key,value));\n"+old,1)
          s=s.replace("const errors=[]; page.on('pageerror',e=>errors.push(e.message));", "const errors=[]; page.on('pageerror',e=>{errors.push(e.message);console.error(name+' page error: '+e.message);});")
          s=s.replace("new TouchEvent(type,{bubbles:true,cancelable:true,touches:type==='touchend'?[]:[new Touch({identifier:42,target:el,clientX:x,clientY:y})],changedTouches:[new Touch({identifier:42,target:el,clientX:x,clientY:y})]})", "Object.assign(new Event(type,{bubbles:true,cancelable:true}),{touches:type==='touchend'?[]:[{identifier:42,target:el,clientX:x,clientY:y}],changedTouches:[{identifier:42,target:el,clientX:x,clientY:y}]})")
          old='    } finally {await browser.close();}'
          assert s.count(old)==1
          s=s.replace(old,"""    } finally {
                for (const context of browser.contexts()) for (const page of context.pages()) {
                  try {
                    await page.screenshot({path:'artifacts/search-photo-'+name+'-last.png'});
                    console.log(name+' final state',await page.evaluate(()=>({url:location.href,scrollY,body:document.body.innerText.slice(0,1000),strips:[...document.querySelectorAll('.job-card-media-scroll')].map(el=>({x:el.scrollLeft,w:el.clientWidth,h:el.clientHeight,sw:el.scrollWidth}))})));
                  } catch {}
                }
                await browser.close();
              }""",1)
          p.write_text(s)
          PY
          mkdir -p artifacts
          git diff --check
          git diff > artifacts/search-photo-swipe.diff
      - run: npm ci
      - name: Critical tests, lint and production build
        shell: bash
        run: npm run build 2>&1 | tee artifacts/build.log
      - run: npx playwright install --with-deps chromium webkit
      - name: Native gestures in the real search component
        shell: bash
        run: node scripts/search-photo-swipe.browser.mjs 2>&1 | tee artifacts/browser.log
      - name: Commit only verified source and regression tests
        run: |
          git add src/components/JobSearchMapView.jsx src/components/JobVideoCard.jsx src/components/jobCardPhotoSummary.css scripts/job-video-facade.test.mjs scripts/search-photo-swipe.browser.mjs docs/search-photo-swipe-2026-10-14.md PROGRESS.md
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore search card photo swipes and remove external photo controls'
          git push origin HEAD:refs/heads/codex/search-photo-swipe-verified-20261014
          echo "Verified commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-photo-swipe-verification
          path: artifacts/
          retention-days: 7
