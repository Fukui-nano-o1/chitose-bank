name: Verify listing card actions
on:
  push:
    branches: [codex/listing-card-actions-20261014]
permissions:
  contents: write
concurrency:
  group: listing-card-actions-20261014
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare final visual verification on the tested source tree
        run: |
          cp scripts/own-job-actions.browser.mjs /tmp/own-job-actions.browser.mjs
          git checkout --detach 633c7eee8068961f4ac55b620abd085b85b0bdbe
          cp /tmp/own-job-actions.browser.mjs scripts/own-job-actions.browser.mjs
          mkdir -p artifacts
          git diff --check
      - run: npm ci
      - name: Critical regression suite, ESLint and production build
        shell: bash
        run: npm run build 2>&1 | tee artifacts/build.log
      - name: Install isolated browser test engines
        run: npx playwright install --with-deps chromium webkit
      - name: Check painted visibility and actual pointer targeting in both mobile engines
        shell: bash
        run: node scripts/own-job-actions.browser.mjs 2>&1 | tee artifacts/browser.log
      - name: Publish verified source without the temporary workflow
        run: |
          git add scripts/own-job-actions.browser.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Verify painted listing actions and pointer targeting'
          git push origin HEAD:refs/heads/codex/listing-card-actions-verified2-20261014
          echo "Verified commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: listing-card-actions-verification
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
