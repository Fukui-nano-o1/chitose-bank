name: Saved job confirmation checks
on:
  pull_request:
    paths:
      - src/features/jobs/favorites/**
      - src/lib/savedJobRecord.js
      - src/lib/useSavedJobMutation.js
      - src/components/LikedJobs.jsx
      - src/components/SavedJobsView.jsx
      - src/components/ProfileHub.jsx
      - src/components/JobSearchMapView.jsx
      - src/features/jobs/search/jobSearchApi.js
      - scripts/saved-job-*.mjs
      - scripts/fixtures/saved-job-*
      - package.json
      - package-lock.json
      - .github/workflows/saved-job-check.yml
permissions:
  contents: read
concurrency:
  group: saved-job-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install isolated Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Saved-job browser regressions (synthetic data, no production access)
        run: node scripts/saved-job-browser.mjs
        env:
          CB_EVIDENCE_DIR: ${{ runner.temp }}/saved-job-browser-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: saved-job-browser-evidence
          path: ${{ runner.temp }}/saved-job-browser-evidence
          retention-days: 7
          if-no-files-found: ignore
