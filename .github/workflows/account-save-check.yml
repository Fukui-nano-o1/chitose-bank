name: Account registration confirmation checks
on:
  pull_request:
    paths:
      - src/lib/accountHolderRecord.js
      - src/components/AccountHolderForm.jsx
      - src/components/LoginScreen.jsx
      - src/main.jsx
      - src/app/browserStartup.js
      - public/registerSW.js
      - index.html
      - scripts/auth-ui.test.mjs
      - scripts/service-worker-registration.test.mjs
      - scripts/fixtures/auth/**
      - scripts/account-save-*.test.mjs
      - scripts/fixtures/account-save-*
      - package.json
      - package-lock.json
      - .github/workflows/account-save-check.yml
permissions:
  contents: read
concurrency:
  group: account-save-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
