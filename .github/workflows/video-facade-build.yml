name: Video facade isolated verification
on:
  push:
    branches: [fix/youtube-facade-20261006]
    paths: [.video-facade-patch.py, .github/workflows/video-facade-build.yml]
permissions:
  contents: write
concurrency:
  group: video-facade-isolated-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply the scoped source change
        run: python3 .video-facade-patch.py
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run new facade regression checks
        run: node --test scripts/job-video-facade.test.mjs
      - name: Run the full production build without skipping checks
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/video-facade-build.log
      - name: Record tested source on the isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .video-facade-patch.py .github/workflows/video-facade-build.yml
          git add package.json src/lib/youtube.js src/components/JobVideoCard.jsx src/components/JobCard.jsx src/components/JobSearchMapView.jsx src/features/jobs/search/components/JobDetailPanel.jsx scripts/fixtures/job-video/entry.jsx scripts/job-video-facade.test.mjs
          git diff --cached --stat
          git commit -m 'Implement tested click-to-load search videos and remove custom sound overlay'
          git push origin HEAD:fix/youtube-facade-20261006
      - name: Keep build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-facade-build-diagnostics
          path: /tmp/video-facade-build.log
          if-no-files-found: ignore
          retention-days: 3
