name: Listing flow foundation checks
on:
  push:
    branches: [main]
    paths:
      - src/features/jobs/create/**
      - scripts/listing-*.test.mjs
      - scripts/fixtures/listing-frame-entry.jsx
      - .github/workflows/listing-flow-foundation-check.yml
  pull_request:
    paths:
      - src/features/jobs/create/**
      - scripts/listing-*.test.mjs
      - scripts/fixtures/listing-frame-entry.jsx
      - package.json
      - .github/workflows/listing-flow-foundation-check.yml
permissions:
  contents: read
concurrency:
  group: listing-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Foundation, save and publication regressions, lint and production build
        run: npm run build
