name: Profile save integrity checks
on:
  pull_request:
    paths:
      - src/lib/profileRecord.js
      - src/lib/profileInput.js
      - src/components/ProfileReadError.jsx
      - src/components/WorkerProfileEdit.jsx
      - src/components/EmployerProfileEdit.jsx
      - src/components/WorkerExperiencePage.jsx
      - src/components/InsurancePrepBox.jsx
      - src/components/VisitAndInsurance.jsx
      - src/components/EmergencyContactBox.jsx
      - scripts/profile-record*.mjs
      - scripts/fixtures/profile-*
      - supabase/migrations/*profile_section_compare_and_save.sql
      - package.json
      - package-lock.json
      - .github/workflows/profile-save-check.yml
permissions:
  contents: read
concurrency:
  group: profile-save-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Regression tests, lint and production bundle
        run: npm run build
