name: Listing stage 3 isolated source
on:
  push:
    branches: [feat/listing-flow-stage3-20261023]
    paths: [.github/workflows/listing-stage3-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Export tracked source only without credentials or environment files
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/listing-flow-stage3-20261023
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/listing-stage3-source.tgz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: listing-stage3-source
          path: ${{ runner.temp }}/listing-stage3-source.tgz
          retention-days: 1
